server {
    listen 80;
    listen [::]:80;
    server_name poc.oragame.eu;
    return 301 https://poc.oragame.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name poc.oragame.eu;

    ssl_certificate /etc/nginx/ssl/oragame.eu/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/oragame.eu/origin.key;

    root /opt/ora/site/current;
    index index.html;
    autoindex off;
    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location ~* \.(?:js|css|svg|json)$ {
        try_files $uri =404;
        expires 5m;
    }

    location /account-api/ {
        gzip off;
        proxy_pass http://127.0.0.1:4100/web/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        client_max_body_size 16k;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/ora-poc.access.log;
    error_log /var/log/nginx/ora-poc.error.log;
}
